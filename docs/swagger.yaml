definitions:
  auth.LoginRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      pending_token:
        type: string
      refresh_token:
        type: string
      require_otp:
        type: boolean
      require_setup_2fa:
        type: boolean
      session:
        $ref: '#/definitions/auth.SessionInfo'
      token_type:
        type: string
      user:
        $ref: '#/definitions/auth.UserSummary'
    type: object
  auth.MeResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_2fa_enabled:
        type: boolean
      phone_number:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
      username:
        type: string
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      captcha_answer:
        type: string
      captcha_token:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      password_confirmation:
        type: string
      phone_number:
        type: string
      role_name:
        enum:
        - super_admin
        - admin
        - karyawan
        - analis_data
        type: string
      username:
        maxLength: 50
        minLength: 4
        type: string
    required:
    - captcha_answer
    - captcha_token
    - email
    - full_name
    - password
    - password_confirmation
    - username
    type: object
  auth.SessionInfo:
    properties:
      browser:
        type: string
      browser_version:
        type: string
      created_at:
        type: string
      device_type:
        type: string
      id:
        type: integer
      ip_address:
        type: string
      location:
        type: string
      os:
        type: string
      os_version:
        type: string
    type: object
  auth.UserSummary:
    properties:
      email:
        type: string
      id:
        type: integer
      role_id:
        type: integer
      role_name:
        type: string
      username:
        type: string
    type: object
  barang.BarangRequest:
    properties:
      deskripsi:
        maxLength: 255
        type: string
      harga_beli:
        minimum: 0
        type: integer
      kategori_id:
        type: integer
      kode_barang:
        maxLength: 30
        type: string
      nama:
        maxLength: 150
        type: string
      satuan_id:
        type: integer
      stok_minimum:
        minimum: 0
        type: integer
    required:
    - kategori_id
    - kode_barang
    - nama
    - satuan_id
    type: object
  utils.Envelope:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
info:
  contact: {}
paths:
  /health:
    get:
      description: Laporan status seluruh komponen inti (DB, dsb).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/utils.Envelope'
      summary: Health check lengkap
      tags:
      - Health
  /health/ready:
    get:
      description: Mengecek apakah aplikasi siap menerima traffic (termasuk cek koneksi
        DB, dsb).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/utils.Envelope'
      summary: Readiness probe
      tags:
      - Health
  /wms-rsd/auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan username & password. Jika 2FA belum aktif, respons
        meminta setup 2FA; jika sudah aktif, meminta verifikasi OTP.
      parameters:
      - description: Kredensial login
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "401":
          description: username/password salah
          schema:
            $ref: '#/definitions/utils.Envelope'
        "403":
          description: akun tidak aktif
          schema:
            $ref: '#/definitions/utils.Envelope'
        "429":
          description: akun terkunci sementara
          schema:
            $ref: '#/definitions/utils.Envelope'
      summary: Login
      tags:
      - Auth
  /wms-rsd/auth/logout:
    post:
      description: Revoke seluruh sesi/refresh token milik user yang sedang login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Envelope'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /wms-rsd/auth/me:
    get:
      description: Mengambil data user yang sedang login berdasarkan access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.MeResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Envelope'
      security:
      - BearerAuth: []
      summary: Profil user aktif
      tags:
      - Auth
  /wms-rsd/auth/refresh:
    post:
      consumes:
      - application/json
      description: Tukar refresh token yang masih valid dengan pasangan access+refresh
        token baru.
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "401":
          description: refresh token tidak valid/kedaluwarsa/di-revoke
          schema:
            $ref: '#/definitions/utils.Envelope'
      summary: Perbarui access token
      tags:
      - Auth
  /wms-rsd/auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan user baru. Wajib menyertakan token & jawaban captcha
        yang valid.
      parameters:
      - description: Data registrasi
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: captcha gagal / payload tidak valid
          schema:
            $ref: '#/definitions/utils.Envelope'
        "409":
          description: username/email sudah dipakai
          schema:
            $ref: '#/definitions/utils.Envelope'
      summary: Registrasi akun baru
      tags:
      - Auth
  /wms-rsd/barang:
    get:
      description: Daftar barang dengan pagination & filter.
      parameters:
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Item per halaman
        in: query
        name: limit
        type: integer
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      - description: Filter kategori
        in: query
        name: kategori_id
        type: integer
      - description: Filter satuan
        in: query
        name: satuan_id
        type: integer
      - description: Hanya tampilkan stok menipis
        in: query
        name: stok_menipis
        type: boolean
      - description: aktif untuk hanya barang aktif
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Envelope'
      security:
      - BearerAuth: []
      summary: Daftar barang
      tags:
      - Barang
    post:
      consumes:
      - application/json
      parameters:
      - description: Data barang
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/barang.BarangRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Envelope'
        "409":
          description: kode barang sudah dipakai
          schema:
            $ref: '#/definitions/utils.Envelope'
      security:
      - BearerAuth: []
      summary: Tambah barang baru
      tags:
      - Barang
  /wms-rsd/barang/{id}:
    get:
      parameters:
      - description: ID barang
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Envelope'
      security:
      - BearerAuth: []
      summary: Detail barang
      tags:
      - Barang
swagger: "2.0"
