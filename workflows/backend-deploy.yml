# File ini: .github/workflows/deploy.yml  (letakkan di repo projsonal/gowms)
#
# Secrets yang wajib diisi di GitHub repo Settings > Secrets and variables > Actions:
#   VPS_HOST        - IP / hostname VPS
#   VPS_USER        - user SSH (mis. gowms atau deploy)
#   VPS_SSH_KEY     - private key SSH (format PEM, tanpa passphrase, khusus deploy)
#   VPS_PORT        - port SSH (opsional, default 22)

name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Generate Swagger docs
        run: swag init -g cmd/main.go -o docs

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Build binary (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o gowms-backend ./cmd/main.go

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gowms-backend
          path: gowms-backend
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gowms-backend

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload binary to VPS (staged path)
        run: |
          chmod +x gowms-backend
          scp -P "${{ secrets.VPS_PORT || 22 }}" gowms-backend \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gowms/backend/gowms-backend.new"

      - name: Atomic swap + restart via systemd
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            sudo mv /opt/gowms/backend/gowms-backend.new /opt/gowms/backend/gowms-backend
            sudo chmod +x /opt/gowms/backend/gowms-backend
            sudo systemctl restart gowms-backend
            sleep 2
            sudo systemctl is-active --quiet gowms-backend
            curl -sf http://127.0.0.1:8080/health/live || (echo "Health check gagal!" && exit 1)
          '
