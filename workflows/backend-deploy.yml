# File ini: .github/workflows/deploy.yml  (letakkan di repo projsonal/inventory)
#
# Secrets yang wajib diisi di GitHub repo Settings > Secrets and variables > Actions:
#   VPS_HOST        - IP / hostname VPS
#   VPS_USER        - user SSH (mis. inventory atau deploy)
#   VPS_SSH_KEY     - private key SSH (format PEM, tanpa passphrase, khusus deploy)
#   VPS_PORT        - port SSH (opsional, default 22)

name: Deploy Backend

on:
  push:
    branches: [main]
    # Push tag juga ikut build + deploy, supaya versi di Settings langsung
    # berubah walau tag dibuat di commit yang sudah pernah ter-deploy.
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # perlu seluruh tag untuk membaca versi terbaru
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Generate Swagger docs
        run: swag init -g cmd/main.go -o docs

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      # Versi di Settings mengikuti tag GitHub terbaru. Kalau belum ada tag
      # sama sekali, VERSION kosong dan nilai cadangan di kode dipakai.
      - name: Resolve version from latest git tag
        run: |
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$TAG" ]; then
            echo "VERSION=v${TAG#v}" >> "$GITHUB_ENV"   # "1.3.4" -> "v1.3.4"
          fi

      - name: Build binary (linux/amd64)
        run: |
          LDFLAGS="-s -w"
          if [ -n "$VERSION" ]; then
            LDFLAGS="$LDFLAGS -X github.com/mfaisal-Ash/inventory-backend/internal/controller/appinfo.CurrentVersion=$VERSION"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="$LDFLAGS" -o inventory-backend ./cmd/main.go

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-backend
          path: inventory-backend
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-backend

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload binary to VPS (staged path)
        run: |
          chmod +x inventory-backend
          scp -P "${{ secrets.VPS_PORT || 22 }}" inventory-backend \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/inventory/backend/inventory-backend.new"

      - name: Atomic swap + restart via systemd
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            sudo mv /opt/inventory/backend/inventory-backend.new /opt/inventory/backend/inventory-backend
            sudo chmod +x /opt/inventory/backend/inventory-backend
            sudo systemctl restart inventory-backend
            sleep 2
            sudo systemctl is-active --quiet inventory-backend
            curl -sf http://127.0.0.1:8080/health/live || (echo "Health check gagal!" && exit 1)
          '
